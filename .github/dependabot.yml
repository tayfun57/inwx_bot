version: 2
updates:
  - package-ecosystem: npm
    directory: /cloudflare-worker
    schedule:
      interval: weekly
    groups:
      worker-deps:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
